<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil - Enexia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/tokens.css">

<style>
/* =====================================================================
   Enexia - Mi Perfil del Participante (Modulo 1)
   Paleta clara "Atardecer Fueguino". Los bordes salen directo de
   tokens.css (--radio-tarjeta: 6px, --radio-campo: 4px -- los mismos
   valores que ya usaban login y registro) para que todo el sitio
   comparta el mismo lenguaje visual, sin overrides locales.

   ALCANCE: solo nombre/apellido/fecha de nacimiento tienen back de
   escritura (PUT /api/usuario/perfil). El email no se puede cambiar
   desde aca (es el dato de recuperacion de cuenta, no el de login desde
   el cambio de nickname -- ver CLAUDE.md "Login identifier changed").
   ===================================================================== */

:root { --panel-ancho: 260px; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--sans); background: var(--lienzo); color: var(--texto-secundario); -webkit-font-smoothing: antialiased; }
a { color: var(--acento); text-decoration: none; }
a:hover { color: var(--acento-fuerte); }
.app { display: flex; min-height: 100vh; }

/* --- Sidebar ----------------------------------------------------------- */

.sidebar { display: flex; flex-direction: column; flex: none; width: var(--panel-ancho); min-height: 100vh; border-right: 1px solid var(--borde); background: var(--superficie); }
.sidebar__logo { display: flex; flex-direction: column; gap: 2px; padding: 26px 24px 18px; }
.sidebar__marca { display: flex; align-items: center; gap: 4px; }
.sidebar__marca svg { display: block; width: 22px; height: 22px; }
.sidebar__marca span { font-family: var(--marca); font-size: 22px; font-weight: 700; color: var(--texto); letter-spacing: -.3px; }
.sidebar__rol { font-size: 11px; color: var(--texto-secundario); padding-left: 2px; }
.sidebar__separador { margin: 4px 24px 12px; border: 0; border-top: 1px solid var(--borde); }
.sidebar__nav { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; flex: 1; }
.sidebar__item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-left: 3px solid transparent; border-radius: var(--radio); color: var(--texto-secundario); font-size: 14px; font-weight: 500; }
.sidebar__item svg { display: block; width: 17px; height: 17px; flex: none; }
.sidebar__item:hover { background: var(--superficie-alt); color: var(--texto); }
.sidebar__item--activo { background: var(--acento-tinte); border-left-color: var(--acento); color: var(--acento-fuerte); }
.sidebar__item--activo:hover { background: var(--acento-tinte); color: var(--acento-fuerte); }
.sidebar__salir { display: flex; align-items: center; gap: 10px; margin: 4px 16px 20px; padding: 11px 14px; border-radius: var(--radio); color: var(--error); font-size: 14px; font-weight: 500; background: transparent; border: 0; cursor: pointer; text-align: left; }
.sidebar__salir:hover { background: var(--error-tinte); }
.sidebar__salir svg { width: 16px; height: 16px; flex: none; }

/* --- Contenido ----------------------------------------------------------- */

.contenido { flex: 1; min-width: 0; padding: 28px 32px 60px; }

.cabecera { margin-bottom: 26px; }
.cabecera h1 { margin: 0 0 6px; color: var(--texto); font-family: var(--marca); font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.cabecera p { margin: 0; font-size: 14px; color: var(--texto-secundario); }

.aviso { margin: 0 0 20px; padding: 14px 16px; border: 1px solid transparent; border-radius: var(--radio-campo); font-size: 13px; line-height: 1.5; display: none; }
.aviso--visible { display: block; }
.aviso--ok { background: var(--ok-tinte); border-color: var(--ok-borde); color: var(--ok); }
.aviso--error { background: var(--error-tinte); border-color: var(--error-borde); color: var(--error); }

/* --- Tarjeta de perfil ----------------------------------------------- */

.perfil-card { max-width: 560px; margin: 0 auto; border: 1px solid var(--borde); border-radius: var(--radio-tarjeta); background: var(--superficie); box-shadow: var(--sombra-tarjeta); overflow: hidden; }

.perfil-card__cabecera { display: flex; align-items: center; gap: 16px; padding: 24px; border-bottom: 1px solid var(--borde); }
.perfil-card__avatar { width: 56px; height: 56px; border-radius: var(--radio-campo); flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--marca); font-size: 20px; font-weight: 700; background: var(--acento-tinte); color: var(--acento-fuerte); border: 1px solid var(--acento-borde); }
.perfil-card__nombre { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--texto); overflow-wrap: anywhere; }
.perfil-card__chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--rol-participante-tinte); color: var(--rol-participante); }

.perfil-card__cuerpo { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

.campo { display: flex; flex-direction: column; gap: 6px; }
.campo__etiqueta { display: flex; align-items: baseline; gap: 4px; color: var(--texto); font-size: 13px; font-weight: 600; }
.campo__etiqueta .oblig { color: var(--accion); }
.entrada { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border: 1px solid var(--borde-campo); border-radius: var(--radio-campo); background: var(--superficie); transition: border-color .15s ease, box-shadow .15s ease; }
.entrada:focus-within { border-color: var(--acento); box-shadow: var(--foco-accion); }
.entrada input { flex: 1 1 0; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--texto); font-family: inherit; font-size: 14px; line-height: 20px; outline: none; }
.entrada--solo-lectura { background: var(--superficie-alt); }
.entrada--solo-lectura input { color: var(--texto-secundario); cursor: default; }
.campo__ayuda { font-size: 11.5px; color: var(--texto-secundario); }
.campo__error { display: none; color: var(--error); font-size: 12px; }
.campo--invalido .campo__error { display: block; }
.campo--invalido .entrada { border-color: var(--error-borde); background: var(--error-tinte); }

/* --- Barra de accion ------------------------------------------------------- */

.barra-accion { display: flex; justify-content: flex-end; gap: 12px; max-width: 560px; margin: 20px auto 0; }
.boton { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 26px; border: 0; border-radius: var(--radio-campo); background: var(--accion); color: var(--sobre-accion); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: var(--sombra-accion); transition: background .15s ease, transform .15s ease; }
.boton:hover { background: var(--accion-hover); color: var(--sobre-accion); }
.boton:active { transform: translateY(1px); }
.boton:disabled { opacity: .65; cursor: not-allowed; transform: none; }
.boton svg { width: 15px; height: 15px; }
.boton__spinner { display: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: girar .7s linear infinite; }
.boton--cargando .boton__spinner { display: inline-block; }
.boton--cargando .boton__icono { display: none; }
@keyframes girar { to { transform: rotate(360deg); } }

.cargando { padding: 40px 24px; text-align: center; color: var(--texto-secundario); font-size: 13px; }

/* --- Toast --------------------------------------------------------------- */

.toast-pila { position: fixed; top: 20px; right: 20px; z-index: 80; display: flex; flex-direction: column; gap: 10px; }
.toast { display: flex; align-items: flex-start; gap: 12px; width: 340px; padding: 16px; border: 1px solid var(--borde); border-left: 4px solid var(--ok); border-radius: var(--radio-campo); background: var(--superficie); box-shadow: var(--sombra-tarjeta); animation: entrar-toast .25s ease; }
.toast--error { border-left-color: var(--error); }
@keyframes entrar-toast { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.toast__icono { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--ok-tinte); color: var(--ok); flex: none; }
.toast--error .toast__icono { background: var(--error-tinte); color: var(--error); }
.toast__icono svg { width: 15px; height: 15px; }
.toast__titulo { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--texto); }
.toast__texto { margin: 0; font-size: 13px; color: var(--texto-secundario); }
.toast__cerrar { margin-left: auto; background: none; border: 0; color: var(--texto-secundario); cursor: pointer; padding: 2px; }
.toast__cerrar svg { width: 13px; height: 13px; }

@media (max-width: 900px) {
    .sidebar { display: none; }
    .contenido { padding: 20px 16px 60px; }
}
</style>
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar__logo">
            <a class="sidebar__marca" href="../../index.html">
                <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M0.0694441 0H10L0.0694441 6.66666V0Z" fill="#F28C1E"/>
                    <path d="M10 0V6.66666H0.0694441L10 0Z" fill="#E05F0A"/>
                    <path d="M10 0H19.9306L10 6.66666V0Z" fill="#F7D000"/>
                    <path d="M19.9306 0V6.66666H10L19.9306 0Z" fill="#E8B400"/>
                    <path d="M0.0694441 6.66667H10L0.0694441 13.3333V6.66667Z" fill="#9B3FB5"/>
                    <path d="M10 6.66667V13.3333H0.0694441L10 6.66667Z" fill="#7A2A90"/>
                    <path d="M10 6.66667H19.9306L10 13.3333V6.66667Z" fill="#00B8D4"/>
                    <path d="M19.9306 6.66667V13.3333H10L19.9306 6.66667Z" fill="#0088AA"/>
                    <path d="M0.0694441 13.3333H10L0.0694441 20V13.3333Z" fill="#43C46A"/>
                    <path d="M10 13.3333V20H0.0694441L10 13.3333Z" fill="#2A9A4A"/>
                    <path d="M10 13.3333H19.9306L10 20V13.3333Z" fill="#1A6FCC"/>
                    <path d="M19.9306 13.3333V20H10L19.9306 13.3333Z" fill="#0E50A0"/>
                    <path d="M19.9306 3.66667H3.68056V8.16667H19.9306V3.66667Z" fill="#faf8fa"/>
                    <path d="M19.9306 11.8333H3.68056V16.3333H19.9306V11.8333Z" fill="#faf8fa"/>
                    <path d="M19.9306 8.16667H13.6111V11.8333H19.9306V8.16667Z" fill="#faf8fa"/>
                </svg>
                <span>NEXIA</span>
            </a>
            <span class="sidebar__rol">Participante</span>
        </div>
        <hr class="sidebar__separador">
        <nav class="sidebar__nav">
            <a class="sidebar__item" href="../../index.html">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.8" stroke="currentColor" stroke-width="1.4"/><path d="M9.95 4.75l-1.1 3.35-3.35 1.1 1.1-3.35 3.35-1.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                Explorar Catalogo
            </a>
            <a class="sidebar__item" href="mis-inscripciones.html">
                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 3v1.3M8 11v1.3M8 7v1.3M1.3 6a2 2 0 0 1 0 4v1.3c0 .35.14.7.4.95.26.26.6.4.95.4h10.7c.35 0 .7-.14.95-.4.26-.26.4-.6.4-.95V10a2 2 0 0 1 0-4V4.7c0-.35-.14-.7-.4-.95a1.3 1.3 0 0 0-.95-.4H2.65c-.35 0-.7.14-.95.4-.26.26-.4.6-.4.95V6Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Mis Inscripciones
            </a>
            <a class="sidebar__item sidebar__item--activo" href="perfil.html">
                <svg viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="8.5" cy="5.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M2.83 14.5c0-3.13 2.54-5.5 5.67-5.5s5.67 2.37 5.67 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                Mi Perfil
            </a>
        </nav>
        <button class="sidebar__salir" id="btnCerrarSesion" type="button">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 14H3.33C2.6 14 2 13.4 2 12.67V3.33C2 2.6 2.6 2 3.33 2H6M10.67 11.33L14 8L10.67 4.67M14 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Cerrar Sesion
        </button>
    </aside>

    <main class="contenido">

        <div class="cabecera">
            <h1>Configuracion de Perfil</h1>
            <p>Actualiza tus datos de identidad y preferencias de Tierra del Fuego.</p>
        </div>

        <div id="avisoPerfil" class="aviso" role="alert" aria-live="polite"></div>

        <form id="formPerfil" novalidate>
            <div class="perfil-card" id="perfilCard">
                <div class="cargando">Cargando tu perfil...</div>
            </div>

            <div class="barra-accion">
                <button type="submit" class="boton" id="btnGuardar">
                    <span class="boton__spinner"></span>
                    <svg class="boton__icono" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12.67 2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5.33L12.67 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.33 2v3.33h5.34V2M5.33 9.33h5.34V14" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                    <span>Guardar Cambios</span>
                </button>
            </div>
        </form>

    </main>
</div>

<div class="toast-pila" id="toastPila" aria-live="polite"></div>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>

<script>
/* =====================================================================
   Mi Perfil del Participante - GET/PUT /api/usuario/perfil (Modulo 1)
   ===================================================================== */
(function () {

    if (!Auth.exigirSesion('../auth/login-desktop-claro.html')) return;

    document.getElementById('btnCerrarSesion').addEventListener('click', function () {
        Auth.cerrarSesion();
        window.location.href = '../auth/login-desktop-claro.html';
    });

    const card = document.getElementById('perfilCard');
    const form = document.getElementById('formPerfil');
    const btnGuardar = document.getElementById('btnGuardar');

    function mostrarToast(tipo, titulo, texto) {
        const pila = document.getElementById('toastPila');
        const el = document.createElement('div');
        el.className = 'toast' + (tipo === 'error' ? ' toast--error' : '');
        el.innerHTML = `
            <span class="toast__icono">
                ${tipo === 'error'
                    ? '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 5.5 10.5 10.5M10.5 5.5 5.5 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
                    : '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
            </span>
            <div><p class="toast__titulo">${titulo}</p><p class="toast__texto">${texto}</p></div>
            <button class="toast__cerrar" type="button">
                <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>`;
        pila.appendChild(el);
        el.querySelector('.toast__cerrar').addEventListener('click', () => el.remove());
        setTimeout(() => el.remove(), 6000);
    }

    function iniciales(...partes) {
        return partes.filter(Boolean).map(p => p.trim().slice(0, 1).toUpperCase()).join('') || '?';
    }

    function fechaParaInput(iso) {
        // El backend manda "yyyy-MM-dd" (LocalDate) -> calza directo con <input type="date">.
        return iso || '';
    }

    function pintarTarjeta(perfil) {
        card.innerHTML = `
            <div class="perfil-card__cabecera">
                <div class="perfil-card__avatar">${iniciales(perfil.nombre, perfil.apellido)}</div>
                <div>
                    <p class="perfil-card__nombre">@${perfil.nickname}</p>
                    <span class="perfil-card__chip">Participante</span>
                </div>
            </div>
            <div class="perfil-card__cuerpo">
                <div class="campo">
                    <label class="campo__etiqueta" for="nombre">Nombre <span class="oblig">*</span></label>
                    <div class="entrada"><input type="text" id="nombre" name="nombre" maxlength="50" value="${perfil.nombre || ''}" required></div>
                    <span class="campo__error"></span>
                </div>
                <div class="campo">
                    <label class="campo__etiqueta" for="apellido">Apellido <span class="oblig">*</span></label>
                    <div class="entrada"><input type="text" id="apellido" name="apellido" maxlength="50" value="${perfil.apellido || ''}" required></div>
                    <span class="campo__error"></span>
                </div>
                <div class="campo">
                    <label class="campo__etiqueta" for="email">Email</label>
                    <div class="entrada entrada--solo-lectura"><input type="text" id="email" value="${perfil.email}" disabled></div>
                    <span class="campo__ayuda">El email de acceso no se puede cambiar desde aca.</span>
                </div>
                <div class="campo">
                    <label class="campo__etiqueta" for="fechaNacimiento">Fecha de Nacimiento <span class="oblig">*</span></label>
                    <div class="entrada"><input type="date" id="fechaNacimiento" name="fechaNacimiento" value="${fechaParaInput(perfil.fechaNacimiento)}" required></div>
                    <span class="campo__error"></span>
                </div>
            </div>
        `;
    }

    async function cargar() {
        card.innerHTML = '<div class="cargando">Cargando tu perfil...</div>';
        const r = await API.obtenerPerfil();

        if (!r.ok) {
            card.innerHTML = '<div class="cargando">No se pudo cargar tu perfil.</div>';
            return;
        }

        pintarTarjeta(r.cuerpo);
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        UI.limpiarErrores();
        UI.ocultarAviso('avisoPerfil');

        const datos = {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            fechaNacimiento: document.getElementById('fechaNacimiento').value
        };

        btnGuardar.disabled = true;
        btnGuardar.classList.add('boton--cargando');

        const r = await API.actualizarPerfil(datos);

        btnGuardar.disabled = false;
        btnGuardar.classList.remove('boton--cargando');

        if (r.ok) {
            mostrarToast('ok', 'Perfil actualizado', 'Tus datos personales se guardaron correctamente.');
            const avatar = document.querySelector('.perfil-card__avatar');
            if (avatar) avatar.textContent = iniciales(r.cuerpo.nombre, r.cuerpo.apellido);
        } else if (r.status === 400 && r.cuerpo && r.cuerpo.errores) {
            UI.pintarErrores(r.cuerpo.errores);
            UI.aviso('avisoPerfil', 'error', UI.mensajeDeError(r));
        } else {
            UI.aviso('avisoPerfil', 'error', UI.mensajeDeError(r));
        }
    });

    cargar();
})();
</script>

</body>
</html>
