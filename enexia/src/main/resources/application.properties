spring.application.name=enexia

# ===============================
# DataSource (MySQL / MariaDB - XAMPP)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/enexia?useSSL=false&serverTimezone=America/Argentina/Ushuaia&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
# update: genera/actualiza tablas desde las @Entity sin borrar datos (desarrollo).
# Cambiar a 'validate' en produccion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# El servidor de XAMPP es MariaDB, no MySQL. El conector de MySQL reporta la
# version con un prefijo "5.5.5" por compatibilidad, y eso hace que Hibernate
# autodetecte MySQLDialect y genere sintaxis que solo entiende MySQL 8
# (por ejemplo "SELECT ... FOR UPDATE OF alias", que MariaDB rechaza).
# Fijar el dialecto a mano evita ese desajuste.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===============================
# Seguridad - JWT (RF-1.2)
# ===============================
# La clave se toma de la variable de entorno JWT_SECRET_KEY.
# El valor por defecto es SOLO para desarrollo local: en produccion definir la env var.
# Debe ser Base64 y de al menos 256 bits (32 bytes) porque se firma con HS256.
enexia.security.jwt.secret-key=${JWT_SECRET_KEY:ZW5leGlhLWRlc2Fycm9sbG8tbG9jYWwtY2xhdmUtaG1hYy1zaGEyNTYtMzJieXRlcy1taW5pbW8=}
# Vigencia del access token en milisegundos (24 h)
enexia.security.jwt.expiration=86400000
enexia.security.jwt.issuer=enexia

# ===============================
# Seguridad - Politica de intentos fallidos (DFD Login 1.2.6)
# ===============================
# 3 fallos  -> requiere_captcha=true + cooldown de 5 minutos
# 6 fallos  -> cooldown de 30 minutos
# 9 fallos  -> estado BLOQUEADO
enexia.security.login.intentos-captcha=3
enexia.security.login.intentos-cooldown-largo=6
enexia.security.login.intentos-bloqueo=9
enexia.security.login.cooldown-corto-minutos=5
enexia.security.login.cooldown-largo-minutos=30

# ===============================
# Seguridad - Rate limiting por IP: RETIRADO (decision 2026-09-08)
# ===============================
# El paso 1.2.1 del DFD de login contemplaba frenar por direccion IP. Se elimino:
# detras de un CGNAT o del wifi de una institucion, cientos de dispositivos
# legitimos comparten una unica IP publica, y bloquearla dejaba sin servicio a
# toda una zona por culpa de un solo atacante.
# La defensa que queda es por CUENTA (escalera de arriba) + bloqueo silencioso.
# RIESGO ABIERTO: el password spraying (1 clave contra miles de emails) ya no
# tiene freno propio. Ver el javadoc de AuthService.

# ===============================
# Seguridad - Recuperacion de acceso (RF-1.5)
# ===============================
# Vigencia del enlace de un solo uso que se manda por email, tanto en el aviso
# de bloqueo automatico como en el restablecimiento pedido por el usuario.
enexia.security.recuperacion.vigencia-minutos=30

# ===============================
# Correo saliente
# ===============================
# Sin spring.mail.host configurado NO se crea el bean JavaMailSender y
# EmailService cae al modo log: escribe el correo (enlace incluido) en la
# consola. Es lo que permite completar el flujo de recuperacion en desarrollo
# sin montar un SMTP. Para usar Mailtrap, descomentar el bloque de abajo.
enexia.email.remitente=no-responder@enexia.local
enexia.email.url-base-frontend=http://localhost:8080
#spring.mail.host=sandbox.smtp.mailtrap.io
#spring.mail.port=2525
#spring.mail.username=${MAILTRAP_USER:}
#spring.mail.password=${MAILTRAP_PASS:}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Cloudinary - Multimedia de eventos (RF-2.3, RF-5.2, RF-5.3)
# ===============================
# Sin cloud-name configurado, CloudinaryService funciona en MODO SIMULADO: no
# sube nada, no llama a la red y aprueba por defecto (salvo que el nombre del
# archivo contenga un marcador de prueba). Ver esa clase.
enexia.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
enexia.cloudinary.api-key=${CLOUDINARY_API_KEY:}
enexia.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
enexia.cloudinary.carpeta=enexia/eventos
# Limite duro por imagen (RF-5.2): 2 MB.
enexia.multimedia.max-bytes=2097152
enexia.multimedia.max-imagenes=3

# ===============================
# Tamano maximo de subida (Spring MVC)
# ===============================
# Debe ser mayor que max-bytes * max-imagenes para que el rechazo por peso lo
# haga la regla de negocio (con su mensaje) y no el contenedor con un 500 seco.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=12MB
