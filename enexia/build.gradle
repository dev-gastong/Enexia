plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.enexia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Envio de correo (RF-1.5 y aviso de bloqueo silencioso). Si no hay SMTP
	// configurado, EmailService cae solo al modo log: ver esa clase.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	// JWT for authentication
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Cloudinary for image storage
	implementation 'com.cloudinary:cloudinary-http44:1.33.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Mockito: pruebas unitarias de la capa service sin levantar Spring ni la BD.
	// La version la fija el BOM de Spring Boot, por eso no se declara.
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'

	// Playwright Java. Ademas del navegador se usa su APIRequestContext, que
	// permite probar los endpoints de extremo a extremo mientras las pantallas
	// del sprint todavia no existen.
	testImplementation 'com.microsoft.playwright:playwright:1.61.0'

	// Awaitility: espera activa con timeout para el pipeline asincrono de
	// moderacion. Reemplaza a los Thread.sleep fijos, que son a la vez lentos
	// (esperan de mas casi siempre) y fragiles (a veces no esperan lo suficiente).
	testImplementation 'org.awaitility:awaitility:4.2.2'

	// Jackson en las pruebas: para armar y leer los cuerpos JSON del cliente de
	// API. La version la fija el BOM de Spring Boot.
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'

	testImplementation platform('org.junit:junit-bom:6.0.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'



	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperties = System.properties as Map<String, ?>
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:deprecation'
}

// Sin esto la JVM arranca con la codificacion del sistema (windows-1252 en esta
// maquina) y los acentos de los mensajes en espanol salen corruptos en las
// respuestas JSON y en los logs.
tasks.withType(JavaExec).configureEach {
	jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.register('installPlaywright', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args = ['install', '--with-deps']
}
